name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # example_data/** lives in Git LFS (~120 MB). Fetch it through the
      # Actions cache so the LFS bandwidth quota is only spent when the
      # data changes, not on every run.
      - name: LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch example data
        run: git lfs pull

      # The Octave-backed tests (FID-A, MRSCloud, Spinach, CustomSLaser) run on
      # one Python only: they do not depend on the Python version and take
      # most of the wall time. The runner has Docker, so on 3.13 they run
      # through BasisREMY's own Octave image (built on CI, which also tests the
      # Dockerfile); the apt Octave is the local fallback. On 3.11 Docker is
      # switched off (BASISREMY_NO_DOCKER, see the Test step) and no Octave is
      # installed, so those tests skip and the job is the unit suite only.
      - name: Install Octave
        if: matrix.python-version == '3.13'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave

      # R + spant so the spant backend's live tests run for real (the
      # package comes as a Posit binary, cached by the action).
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::spant
          cache: true

      # Spinach is fetched on first use (sparse clone of a pinned commit, see
      # core/externals.py); keep it between runs so the live tests do not
      # download it every time.
      - uses: actions/cache@v4
        with:
          path: externals/spinach
          key: spinach-998fbc02777f4f7785757494b43dbb42a0954274-${{ hashFiles('basisremy/adapters/backends/spinach_octave.patch') }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev

      - name: Test
        env:
          BASISREMY_NO_DOCKER: ${{ matrix.python-version == '3.11' && '1' || '' }}
        run: uv run pytest -q -m "not heavy"
