name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # example_data/** lives in Git LFS (~120 MB). Fetch it through the
      # Actions cache so the LFS bandwidth quota is only spent when the
      # data changes, not on every run.
      - name: LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch example data
        run: git lfs pull

      # Local Octave so the Octave-backed tests (FID-A, MRSCloud, CustomSLaser)
      # run for real instead of being skipped; Docker is not used on CI. Only
      # on one Python: the Octave side does not depend on the Python version
      # and takes most of the wall time, so on 3.11 those tests skip.
      - name: Install Octave
        if: matrix.python-version == '3.13'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave

      # R + spant so the spant backend's live tests run for real (the
      # package comes as a Posit binary, cached by the action).
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::spant
          cache: true

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev

      - name: Test
        run: uv run pytest -q -m "not heavy"
