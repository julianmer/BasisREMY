[pytest]
# Pytest configuration for BasisREMY

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    -p nicegui.testing.user_plugin

# Async test support (GUI smoke tests use NiceGUI's simulated User).
# main_file is empty: the GUI tests register the page themselves.
asyncio_mode = auto
main_file =

# Markers for test categorization
markers =
    core: Core functionality tests (octave_manager, basisremy, etc.)
    remy: REMY data format parsing tests
    backend: Backend simulation tests
    lcmodel: LCModel backend tests
    slaser: sLaser backend tests
    slow: Tests that take a long time to run
    heavy: Live simulations too slow for CI (deselected there with -m "not heavy")
    docker: Tests that require Docker
    integration: Integration tests
    unit: Unit tests

# Test paths
testpaths = tests

# Directories pytest must never recurse into
norecursedirs = .git .tox dist build *.egg externals legacy docker_setup output __pycache__

# Minimum Python version
minversion = 3.8

# Coverage options (if using pytest-cov)
# addopts = --cov=. --cov-report=html --cov-report=term

